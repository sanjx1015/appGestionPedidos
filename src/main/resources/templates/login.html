
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión - AutoFix360</title>

    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body class="login-page">

<main class="login-container">

    <section class="login-card">

        <div class="login-logo">
            <img th:src="@{/images/AutoFixLOGO.jpeg}"
                 alt="Logo AutoFix360">
        </div>

        <div class="login-header">
            <h1>Bienvenido</h1>
            <p>Ingresa tus credenciales para continuar</p>
        </div>

        <p th:if="${error}"
           th:text="${error}"
           class="error-message">
        </p>

        <form th:action="@{/login}" method="post">

            <div class="login-input-group">
                <label for="username">Nombre de usuario</label>

                <input type="text"
                       id="username"
                       name="username"
                       placeholder="Ingresa tu usuario"
                       autocomplete="username"
                       required>
            </div>

            <div class="login-input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" autocomplete="current-password" required>
            </div>

            <button type="submit" class="login-button">
                Iniciar sesión
            </button>

        </form>

        <div class="login-footer">
            <a th:href="@{/}">
                ← Volver al inicio
            </a>
        </div>

    </section>

    <p class="login-copyright">
        © 2026 AutoFix360. Todos los derechos reservados.
    </p>

</main>

</body>
</html>
