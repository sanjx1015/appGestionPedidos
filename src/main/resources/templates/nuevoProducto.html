<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoFix360 | Registrar producto</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<header class="site-header">
    <nav class="navbar container">
        <a class="brand" th:href="@{/}"><img th:src="@{/images/AutoFixLOGO.jpeg}" alt="Logo AutoFix360"><span>AutoFix<span class="brand-accent">360</span></span></a>
        <div class="nav-links"><a class="nav-link" th:href="@{/}">Inicio</a><a class="nav-link" th:href="@{/userhome}">Volver a casa</a></div>
    </nav>
</header>
<main class="container page-main">
    <div class="page-heading">
        <span class="eyebrow">CATÁLOGO</span>
        <h1>Registrar producto</h1>
        <p>Completa la información para agregar un producto al catálogo.</p>
    </div>
    <section class="form-card">
        <p class="alert alert-error" th:if="${error}" th:text="${error}"></p>
        <form th:action="@{/productos/nuevo}" method="post" class="data-form">
            <div class="form-field">
                <label for="nombre">Nombre del producto</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej. Filtro de aceite" required>
            </div>
            <div class="form-field">
                <label for="descripcion">Descripción</label>
                <textarea id="descripcion" name="descripcion" placeholder="Describe las características del producto" rows="4" required></textarea>
            </div>
            <div class="form-field">
                <label for="precio">Precio</label>
                <div class="input-prefix"><span>₡</span><input type="number" step="0.01" min="0" id="precio" name="precio" placeholder="0.00" required></div>
            </div>
            <div class="form-actions">
                <a class="button button-secondary" th:href="@{/}">Cancelar</a>
                <button class="button button-primary" type="submit">Registrar producto</button>
            </div>
        </form>
    </section>
</main>
<footer class="site-footer"><div class="container">AutoFix360 · Sistema de gestión</div></footer>
</body>
</html>
